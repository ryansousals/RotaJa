server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-src https://www.openstreetmap.org; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location /api/ {
        proxy_pass http://api:3001/;
        proxy_set_header Host $host;
        # A API local identifica o proxy diretamente; não aceitar cabeçalhos forjados.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /socket.io/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 90s;
    }
    location /assets/ { expires 1y; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
}
